spring:
  profiles:
    active: dev

  #Liquibase是一个开源的数据库版本控制工具，用于管理数据库结构和数据的变更，支持多种数据库并实现跨平台迁移。
  liquibase:
    enabled: false

  # mysql连接信息
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    # mysql8之后
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/flowable?useUnicode=true&characterEncoding=utf8&tinyInt1isBit=false&useSSL=false&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
    username: root
    password: 123456

    druid: # Druid 【连接池】相关的全局配置
      initial-size: 5 # 初始连接数
      min-idle: 10 # 最小连接池数量
      max-active: 20 # 最大连接池数量
      max-wait: 600000 # 配置获取连接等待超时的时间，单位：毫秒
      time-between-eviction-runs-millis: 60000 # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位：毫秒
      min-evictable-idle-time-millis: 300000 # 配置一个连接在池中最小生存的时间，单位：毫秒
      max-evictable-idle-time-millis: 900000 # 配置一个连接在池中最大生存的时间，单位：毫秒
      validation-query: SELECT 1 # 配置检测连接是否有效
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 监控配置
      stat-view-servlet:
        enabled: false
        url-pattern: /druid/*
        login-username: druid
        login-password: druid

flowable:
  #关闭定时任务job
  async-executor-activate: false
  #对数据库表进行操作，如果表不存在则会新建
  database-schema-update: true
